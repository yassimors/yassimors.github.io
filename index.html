<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caftan — aperçu 3D</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#160f15;--gold:#d9b77a;--muted:#b7a9b3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 38%,#49303c 0%,#241821 42%,var(--bg) 82%);color:#f6edf2;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,1000px);border:1px solid #72574480;border-radius:24px;overflow:hidden;background:#170f16b8;box-shadow:0 28px 90px #0008}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-bottom:1px solid #ffffff14}h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:.02em}.tag{color:var(--gold);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.stage{position:relative}model-viewer{display:block;width:100%;height:min(74vh,760px);min-height:460px;--poster-color:transparent;background:radial-gradient(ellipse at center,#59434c 0%,#2d202a 48%,#1b131b 100%);--progress-bar-color:var(--gold);--progress-mask:var(--bg)}
#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:80%;padding:12px 16px;border:1px solid #d9b77a55;border-radius:12px;background:#160f15e8;color:#ead3ac;text-align:center;font-size:14px}#status[hidden]{display:none}#status.error{color:#ffd0c7;border-color:#d88a7a}
footer{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:17px 24px;color:var(--muted);font-size:13px}.hint{display:flex;align-items:center;gap:9px}.dot{width:7px;height:7px;background:var(--gold);border-radius:50%}.badge{border:1px solid #d9b77a55;border-radius:99px;padding:6px 11px;color:#ead3ac;white-space:nowrap}
@media(max-width:600px){body{padding:10px}main{border-radius:17px}header{padding:17px}model-viewer{height:70vh;min-height:420px}footer{padding:13px 16px;flex-wrap:wrap}}
</style></head>
<body><main>
<header><div><div class="tag">Aperçu de la pièce</div><h1>Caftan brodé — prune</h1></div><div class="badge">3D interactif</div></header>
<div class="stage"><model-viewer id="caftan" src="./caftan.glb" alt="Modèle 3D d’un caftan brodé prune" camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="1800" rotation-per-second="18deg" environment-image="neutral" exposure="1" shadow-intensity="0.8" camera-orbit="0deg 75deg auto" min-camera-orbit="auto 35deg auto" max-camera-orbit="auto 105deg auto" interaction-prompt="auto" loading="eager"></model-viewer><div id="status">Chargement du modèle 3D…</div></div>
<footer><span class="hint"><i class="dot"></i>Glissez pour faire pivoter · Pincez ou utilisez la molette pour zoomer</span><span>Modèle reconstruit à partir de photos</span></footer>
</main><script>
const viewer=document.querySelector('#caftan'),status=document.querySelector('#status');
viewer.addEventListener('load',()=>{status.hidden=true;});
viewer.addEventListener('error',e=>{status.hidden=false;status.classList.add('error');status.textContent='Le modèle ne s’est pas chargé. Vérifiez que « caftan.glb » est dans le même dossier que index.html et que son URL directe renvoie bien le fichier.';console.error('Erreur de chargement GLB:',e.detail||e);});
setTimeout(()=>{if(!viewer.loaded){status.hidden=false;status.classList.add('error');status.textContent='Toujours en attente du modèle. Vérifiez le chemin du fichier caftan.glb et actualisez la page.';}},15000);
</script></body></html>
